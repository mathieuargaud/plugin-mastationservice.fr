<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>MaStationService</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="entete">
    <img src="logo-mark.svg" alt="" width="32" height="32">
    <span class="nom">MaStationService</span>
  </header>
  <main>
    <form id="recherche" class="recherche" role="search">
      <label for="ville" class="cache">Ville</label>
      <div class="champ-ville">
        <input id="ville" type="search" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="suggestions" placeholder="Saisir une ville" autocomplete="off">
        <ul id="suggestions" class="suggestions" role="listbox" aria-label="Villes" hidden></ul>
      </div>
      <button type="button" id="ma-position" class="bouton">Ma position</button>
    </form>
    <div class="choix">
      <label for="carburant">Carburant</label>
      <select id="carburant">
        <option value="gazole">Gazole</option>
        <option value="sp95">SP95</option>
        <option value="sp98">SP98</option>
        <option value="e10">E10</option>
        <option value="e85">E85</option>
        <option value="gplc">GPLc</option>
      </select>
    </div>
    <p id="bandeau" class="bandeau" role="status" hidden></p>
    <p id="etat" class="etat" role="status" aria-live="polite"></p>
    <button type="button" id="reessayer" class="bouton" hidden>Réessayer</button>
    <ol id="liste" class="liste"></ol>
  </main>
  <footer class="pied">
    <a href="https://www.mastationservice.fr/" target="_blank" rel="noopener">Tous les prix sur mastationservice.fr</a>
  </footer>
  <script type="module" src="main.js"></script>
</body>
</html>
